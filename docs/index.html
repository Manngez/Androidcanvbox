<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#121018"><title>Pocket Canvas</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px system-ui,-apple-system,sans-serif;background:#0d0c12;color:#f8f5ff}button,textarea{font:inherit}header{height:60px;background:#17151f;border-bottom:1px solid #312c3e;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:9px;font-weight:750}.logo{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#ff7849,#8f74ff)}header button,.zoom button{border:1px solid #3b3548;background:#252130;color:white;border-radius:10px;padding:9px 12px}.canvas{position:absolute;inset:60px 0 82px;overflow:hidden;touch-action:none;background-image:radial-gradient(#393445 1px,transparent 1px);background-size:30px 30px}.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.wires path{fill:none;stroke:#775dff;stroke-width:3;filter:drop-shadow(0 0 5px #6548ff)}.phone{position:absolute;width:270px;height:480px;border:1px solid #4b4558;border-radius:30px;background:#faf8ff;color:#1d1924;overflow:hidden;box-shadow:0 25px 60px #000a,0 0 0 4px #17151f;transform-origin:top left}.bar{height:47px;background:#211e2b;color:white;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none}.notch{position:absolute;top:7px;width:65px;height:13px;background:#08070c;border-radius:12px}.bar b{font-size:13px}.screen{height:414px;padding:22px 19px;background:linear-gradient(150deg,#fff,#f3effb)}.orb{width:45px;height:45px;border-radius:15px;margin-bottom:19px}.screen h2{font-size:26px;line-height:1.08;letter-spacing:-.04em;margin:0 0 10px}.screen p{font-size:14px;line-height:1.5;color:#6a6273;margin:0 0 18px}.card{height:47px;padding:0 13px;margin:8px 0;border:1px solid #e3deea;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:650}.primary{width:100%;height:46px;margin-top:13px;border:0;border-radius:13px;background:#211e2b;color:white;font-weight:700}.composer{position:fixed;z-index:8;left:50%;bottom:10px;transform:translateX(-50%);width:min(700px,calc(100% - 18px));height:64px;padding:8px;display:flex;gap:8px;align-items:center;border:1px solid #413a50;border-radius:18px;background:#1d1a26f5;box-shadow:0 15px 50px #000b}.composer textarea{flex:1;height:45px;resize:none;border:0;outline:0;padding:11px 8px;background:transparent;color:white}.composer button{height:44px;border:0;border-radius:12px;padding:0 16px;background:linear-gradient(135deg,#9c7dff,#7052f6);color:white;font-weight:700}.composer button:disabled{opacity:.45}.zoom{position:absolute;z-index:6;right:12px;bottom:94px;display:flex;align-items:center;gap:5px;background:#191620;border:1px solid #342f40;border-radius:12px;padding:4px}.zoom button{width:38px;border:0;padding:7px}.zoom span{width:48px;text-align:center;font-size:12px;color:#aaa3b8}.hint{position:absolute;z-index:4;top:74px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1b1824e8;border:1px solid #383243;border-radius:99px;padding:7px 11px;color:#aaa3b8;font-size:12px;pointer-events:none}.modal{position:fixed;inset:0;z-index:20;background:#08070cdd;display:grid;place-items:center}.modal .phone{position:relative;transform:none!important}.close{position:absolute;z-index:22;top:14px;right:14px;border:1px solid #4a4356;background:#211e2b;color:#fff;border-radius:11px;width:42px;height:42px;font-size:22px}@media(max-width:600px){header .wide{display:none}.hint{font-size:11px}.phone{box-shadow:0 20px 55px #000b,0 0 0 4px #17151f}}
</style></head><body><header><div class="brand"><span class="logo">◆</span><span>Pocket Canvas</span></div><button id="preview">▶ <span class="wide">Förhandsvisa</span></button></header><div class="hint">Dra skärmarna · dra bakgrunden för att panorera</div><div class="zoom"><button id="minus">−</button><span id="percent">76%</span><button id="plus">+</button></div><main class="canvas" id="canvas"><svg class="wires" id="wires"></svg></main><div class="composer"><textarea id="prompt" placeholder="Beskriv appen du vill skapa…"></textarea><button id="create">✦ Skapa</button></div><script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),wireSvg=$('#wires');let scale=.76,pan={x:20,y:12},preview=null;
let frames=[{id:'start',title:'Välkommen',x:65,y:65,color:'#ff7849',items:[['h','Träna tillsammans'],['p','Ett enkelt program för dig och din träningskompis.'],['c','Nästa pass · Pass A'],['b','Starta passet','workout']]},{id:'workout',title:'Pass A',x:410,y:190,color:'#a78bfa',items:[['h','Hela kroppen'],['p','6 övningar · cirka 45 minuter'],['c','Benpress · 3 × 10'],['c','Bröstpress · 3 × 10'],['b','Börja träna','done']]},{id:'done',title:'Färdigt',x:755,y:70,color:'#38d39f',items:[['h','Bra jobbat!'],['p','Passet är sparat i träningsloggen.'],['c','45 min · 6 övningar'],['b','Till startsidan','start']]}];
function phone(f,modal=false){let el=document.createElement('article');el.className='phone';el.dataset.id=f.id;el.innerHTML=`<div class="bar"><i class="notch"></i><b>${f.title}</b></div><div class="screen"><div class="orb" style="background:${f.color}"></div>${f.items.map(v=>v[0]=='h'?`<h2>${v[1]}</h2>`:v[0]=='p'?`<p>${v[1]}</p>`:v[0]=='c'?`<div class="card">${v[1]} <span>›</span></div>`:`<button class="primary" data-target="${v[2]||''}">${v[1]}</button>`).join('')}</div>`;if(!modal){let d=null;el.querySelector('.bar').onpointerdown=e=>{d={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId)};el.querySelector('.bar').onpointermove=e=>{if(!d)return;f.x+=(e.clientX-d.x)/scale;f.y+=(e.clientY-d.y)/scale;d={x:e.clientX,y:e.clientY};render()};el.querySelector('.bar').onpointerup=()=>d=null}el.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>showPreview(b.dataset.target));return el}
function render(){canvas.querySelectorAll('.phone').forEach(x=>x.remove());frames.forEach(f=>{let el=phone(f);el.style.transform=`translate(${pan.x+f.x*scale}px,${pan.y+f.y*scale}px) scale(${scale})`;canvas.appendChild(el)});wireSvg.innerHTML=frames.flatMap(f=>f.items.filter(v=>v[2]).map(v=>{let t=frames.find(x=>x.id==v[2]);if(!t)return'';let x1=pan.x+(f.x+270)*scale,y1=pan.y+(f.y+240)*scale,x2=pan.x+t.x*scale,y2=pan.y+(t.y+240)*scale;return`<path d="M${x1} ${y1} C${x1+80} ${y1},${x2-80} ${y2},${x2} ${y2}"/>`})).join('');$('#percent').textContent=Math.round(scale*100)+'%'}
function showPreview(id){let f=frames.find(x=>x.id==id)||frames[0],m=document.createElement('div');m.className='modal';m.innerHTML='<button class="close">×</button>';m.appendChild(phone(f,true));m.onclick=e=>{if(e.target==m||e.target.classList.contains('close'))m.remove()};document.body.appendChild(m)}
function generate(){let input=$('#prompt'),text=input.value.trim();if(!text)return;let low=text.toLowerCase(),title=low.includes('recept')?'Veckans recept':low.includes('spel')?'Nytt spel':low.includes('träning')?'Ditt träningspass':'Din nya app';frames=[{id:'start',title:'Start',x:65,y:70,color:'#ff7849',items:[['h',title],['p',text.replace(/[<>]/g,'')],['b','Kom igång','home']]},{id:'home',title:'Översikt',x:410,y:190,color:'#a78bfa',items:[['h','Allt på en plats'],['c','Dina favoriter'],['c','Senast öppnat'],['b','Öppna','detail']]},{id:'detail',title:'Detalj',x:755,y:70,color:'#38d39f',items:[['h','Redo att användas'],['p','Flödet är klickbart och kan byggas vidare.'],['b','Tillbaka','start']]}];pan={x:20,y:12};render()}
let pd=null;canvas.onpointerdown=e=>{if(e.target==canvas){pd={x:e.clientX-pan.x,y:e.clientY-pan.y};canvas.setPointerCapture(e.pointerId)}};canvas.onpointermove=e=>{if(pd){pan={x:e.clientX-pd.x,y:e.clientY-pd.y};render()}};canvas.onpointerup=()=>pd=null;canvas.onwheel=e=>{e.preventDefault();scale=Math.max(.42,Math.min(1.25,scale-e.deltaY*.001));render()};$('#minus').onclick=()=>{scale=Math.max(.42,scale-.1);render()};$('#plus').onclick=()=>{scale=Math.min(1.25,scale+.1);render()};$('#create').onclick=generate;$('#preview').onclick=()=>showPreview(frames[0].id);$('#prompt').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();generate()}};render();
</script></body></html>
