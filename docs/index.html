<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14121b"><title>Pocket Canvas</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px system-ui,-apple-system,sans-serif;background:#0d0c12;color:#f8f5ff}button,input,textarea{font:inherit}button{cursor:pointer}header{height:60px;background:#17151ff7;border-bottom:1px solid #312c3e;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:8px;font-weight:760}.logo{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#ff7849,#8f74ff)}.actions{display:flex;gap:7px}.actions button,.zoom button{border:1px solid #3b3548;background:#252130;color:white;border-radius:10px;padding:9px 11px}.actions .play{background:#8065f5}.canvas{position:absolute;inset:60px 0 82px;overflow:hidden;touch-action:none;background-image:radial-gradient(#393445 1px,transparent 1px);background-size:30px 30px}.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.wires path{fill:none;stroke:#775dff;stroke-width:3;filter:drop-shadow(0 0 5px #6548ff)}.phone{position:absolute;width:270px;height:480px;border:1px solid #4b4558;border-radius:30px;background:#faf8ff;color:#1d1924;overflow:hidden;box-shadow:0 25px 60px #000a,0 0 0 4px #17151f;transform-origin:top left}.bar{height:47px;background:#211e2b;color:white;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none}.notch{position:absolute;top:7px;width:65px;height:13px;background:#08070c;border-radius:12px}.bar b{font-size:13px}.screen{height:414px;padding:22px 19px;background:linear-gradient(150deg,#fff,#f3effb)}.orb{width:45px;height:45px;border-radius:15px;margin-bottom:19px}.screen h2{font-size:26px;line-height:1.08;letter-spacing:-.04em;margin:0 0 10px}.screen p{font-size:14px;line-height:1.5;color:#6a6273;margin:0 0 18px}.card{min-height:47px;padding:12px 13px;margin:8px 0;border:1px solid #e3deea;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:650}.primary{width:100%;min-height:46px;margin-top:13px;border:0;border-radius:13px;background:#211e2b;color:white;font-weight:700}.composer{position:fixed;z-index:8;left:50%;bottom:10px;transform:translateX(-50%);width:min(700px,calc(100% - 18px));height:64px;padding:8px;display:flex;gap:8px;align-items:center;border:1px solid #413a50;border-radius:18px;background:#1d1a26f8;box-shadow:0 15px 50px #000b}.composer textarea{flex:1;height:45px;resize:none;border:0;outline:0;padding:11px 8px;background:transparent;color:white}.composer button{height:44px;border:0;border-radius:12px;padding:0 16px;background:linear-gradient(135deg,#9c7dff,#7052f6);color:white;font-weight:700}.composer button:disabled{opacity:.45}.zoom{position:absolute;z-index:6;right:10px;bottom:94px;display:flex;align-items:center;gap:4px;background:#191620;border:1px solid #342f40;border-radius:12px;padding:4px}.zoom button{width:38px;border:0;padding:7px}.zoom span{width:46px;text-align:center;font-size:12px;color:#aaa3b8}.hint{position:absolute;z-index:4;top:72px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1b1824e8;border:1px solid #383243;border-radius:99px;padding:7px 11px;color:#aaa3b8;font-size:12px;pointer-events:none}.overlay{position:fixed;inset:0;z-index:20;background:#08070cdd;display:grid;place-items:center;padding:16px}.dialog{width:min(480px,100%);max-height:88vh;overflow:auto;background:#1d1a26;border:1px solid #40394e;border-radius:22px;padding:20px;box-shadow:0 25px 80px #000}.dialog h2{margin:0 0 6px;font-size:22px}.dialog p{color:#aaa3b8;line-height:1.5;font-size:14px}.field{display:block;margin:15px 0 6px;font-size:13px;color:#c6bfd2}.dialog input,.dialog textarea{width:100%;border:1px solid #494154;border-radius:12px;background:#111018;color:white;padding:12px;outline:none}.dialog textarea{min-height:170px;resize:vertical}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.row button,.project{border:1px solid #484052;background:#292433;color:white;border-radius:11px;padding:10px 14px}.row .save{background:#8065f5;border-color:#8065f5}.project{width:100%;display:flex;justify-content:space-between;margin:8px 0;text-align:left}.project small{color:#aaa3b8}.preview-wrap{width:270px;height:480px;position:relative}.preview-wrap .phone{position:relative;transform:none!important}.close{position:absolute;z-index:22;top:12px;right:12px;border:1px solid #4a4356;background:#211e2b;color:white;border-radius:11px;width:42px;height:42px;font-size:22px}.status{position:fixed;z-index:30;left:50%;top:70px;transform:translateX(-50%);background:#211d2b;border:1px solid #4a4158;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 10px 40px #000;max-width:calc(100% - 24px)}.hidden{display:none!important}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.actions button{padding:9px}.actions button span{display:none}.brand{font-size:15px}.hint{font-size:11px}.phone{box-shadow:0 20px 55px #000b,0 0 0 4px #17151f}.dialog{padding:17px;border-radius:18px}}
</style></head><body>
<header><div class="brand"><span class="logo">◆</span><span id="projectName">Pocket Canvas</span></div><div class="actions"><button id="projects">▤ <span>Projekt</span></button><button id="settings">⚙ <span>API</span></button><button class="play" id="preview">▶ <span>Testa</span></button></div></header>
<div class="hint">Dra skärmar · nyp för att zooma · tryck för att redigera</div><div class="zoom"><button id="minus">−</button><span id="percent">76%</span><button id="plus">+</button></div><main class="canvas" id="canvas"><svg class="wires" id="wires"></svg></main>
<div class="composer"><textarea id="prompt" placeholder="Beskriv appen du vill skapa…"></textarea><button id="create">✦ Skapa</button></div><div id="status" class="status hidden"></div><div id="dialogs"></div>
<script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),wireSvg=$('#wires'),dialogs=$('#dialogs'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let scale=.76,pan={x:18,y:10},pointers=new Map(),pinch=null,activeId=localStorage.pcActive||'demo';
const seed=[{id:'start',title:'Välkommen',x:65,y:65,color:'#ff7849',items:[{type:'heading',text:'Träna tillsammans',target:null},{type:'text',text:'Ett enkelt program för dig och din träningskompis.',target:null},{type:'card',text:'Nästa pass · Pass A',target:null},{type:'button',text:'Starta passet',target:'workout'}]},{id:'workout',title:'Pass A',x:410,y:190,color:'#a78bfa',items:[{type:'heading',text:'Hela kroppen',target:null},{type:'text',text:'6 övningar · cirka 45 minuter',target:null},{type:'card',text:'Benpress · 3 × 10',target:null},{type:'button',text:'Börja träna',target:'done'}]},{id:'done',title:'Färdigt',x:755,y:70,color:'#38d39f',items:[{type:'heading',text:'Bra jobbat!',target:null},{type:'text',text:'Passet är sparat i träningsloggen.',target:null},{type:'button',text:'Till startsidan',target:'start'}]}];
let projects=(()=>{try{return JSON.parse(localStorage.pcProjects)||{demo:{name:'Träningsapp',frames:seed}}}catch{return{demo:{name:'Träningsapp',frames:seed}}}})();if(!projects[activeId])activeId=Object.keys(projects)[0]||'demo';let frames=structuredClone(projects[activeId]?.frames||seed);
function toast(t,bad=false){let s=$('#status');s.textContent=t;s.style.borderColor=bad?'#a94757':'#4a4158';s.classList.remove('hidden');setTimeout(()=>s.classList.add('hidden'),3200)}
function persist(){projects[activeId]={name:projects[activeId]?.name||'Namnlöst projekt',frames};localStorage.pcProjects=JSON.stringify(projects);localStorage.pcActive=activeId;$('#projectName').textContent=projects[activeId].name}
function phone(f,modal=false){let el=document.createElement('article');el.className='phone';el.dataset.id=f.id;el.innerHTML=`<div class="bar"><i class="notch"></i><b>${esc(f.title)}</b></div><div class="screen"><div class="orb" style="background:${esc(f.color)}"></div>${f.items.map(v=>v.type==='heading'?`<h2>${esc(v.text)}</h2>`:v.type==='text'?`<p>${esc(v.text)}</p>`:v.type==='card'?`<div class="card">${esc(v.text)} <span>›</span></div>`:`<button class="primary" data-target="${esc(v.target||'')}">${esc(v.text)}</button>`).join('')}</div>`;
if(!modal){let d=null;el.querySelector('.bar').onpointerdown=e=>{e.stopPropagation();d={x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture(e.pointerId)};el.querySelector('.bar').onpointermove=e=>{if(!d)return;f.x+=(e.clientX-d.x)/scale;f.y+=(e.clientY-d.y)/scale;d={x:e.clientX,y:e.clientY};render()};el.querySelector('.bar').onpointerup=()=>{d=null;persist()};el.querySelector('.screen').onclick=e=>{if(!e.target.closest('button'))editFrame(f.id)}}el.querySelectorAll('[data-target]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(modal&&b.dataset.target)showPreview(b.dataset.target)});return el}
function render(){canvas.querySelectorAll('.phone').forEach(x=>x.remove());frames.forEach(f=>{let el=phone(f);el.style.transform=`translate(${pan.x+f.x*scale}px,${pan.y+f.y*scale}px) scale(${scale})`;canvas.appendChild(el)});wireSvg.innerHTML=frames.flatMap(f=>f.items.filter(v=>v.target).map(v=>{let t=frames.find(x=>x.id===v.target);if(!t)return'';let x1=pan.x+(f.x+270)*scale,y1=pan.y+(f.y+240)*scale,x2=pan.x+t.x*scale,y2=pan.y+(t.y+240)*scale;return`<path d="M${x1} ${y1} C${x1+80} ${y1},${x2-80} ${y2},${x2} ${y2}"/>`})).join('');$('#percent').textContent=Math.round(scale*100)+'%';$('#projectName').textContent=projects[activeId]?.name||'Pocket Canvas'}
function dialog(html){dialogs.innerHTML=`<div class="overlay"><section class="dialog">${html}</section></div>`;dialogs.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))dialogs.innerHTML=''}}function closeDialog(){dialogs.innerHTML=''}
function apiDialog(){dialog(`<h2>OpenAI API</h2><p>Nyckeln sparas bara tills du stänger webbläsarfliken. Den byggs aldrig in i sidan eller projektet.</p><label class="field">API-nyckel</label><input id="key" type="password" autocomplete="off" placeholder="sk-…" value="${esc(sessionStorage.pcKey||'')}"><div class="row"><button id="cancel">Avbryt</button><button class="save" id="saveKey">Spara för sessionen</button></div>`);$('#cancel').onclick=closeDialog;$('#saveKey').onclick=()=>{sessionStorage.pcKey=$('#key').value.trim();closeDialog();toast('API-nyckeln är redo')}}
function projectsDialog(){let list=Object.entries(projects).map(([id,p])=>`<button class="project" data-id="${esc(id)}"><b>${esc(p.name)}</b><small>${p.frames.length} skärmar</small></button>`).join('');dialog(`<h2>Dina projekt</h2><p>Allt sparas lokalt på den här enheten.</p>${list}<div class="row"><button id="newProject">＋ Nytt projekt</button><button id="cancel">Stäng</button></div>`);document.querySelectorAll('.project').forEach(b=>b.onclick=()=>{activeId=b.dataset.id;frames=structuredClone(projects[activeId].frames);pan={x:18,y:10};closeDialog();render()});$('#newProject').onclick=()=>{let name=prompt('Projektets namn')?.trim();if(!name)return;activeId='p'+Date.now();projects[activeId]={name,frames:[]};frames=[];persist();closeDialog();render()};$('#cancel').onclick=closeDialog}
function editFrame(id){let f=frames.find(x=>x.id===id);if(!f)return;let lines=f.items.map(v=>`${v.type}|${v.text}|${v.target||''}`).join('\n');dialog(`<h2>Redigera skärm</h2><label class="field">Skärmens namn</label><input id="frameTitle" value="${esc(f.title)}"><label class="field">Element – typ | text | målskärm</label><textarea id="elements">${esc(lines)}</textarea><p>Typer: heading, text, card och button. Målskärm behövs bara för knappar.</p><div class="row"><button id="deleteFrame">Ta bort</button><button id="cancel">Avbryt</button><button class="save" id="saveFrame">Spara</button></div>`);$('#cancel').onclick=closeDialog;$('#deleteFrame').onclick=()=>{frames=frames.filter(x=>x.id!==id);persist();closeDialog();render()};$('#saveFrame').onclick=()=>{f.title=$('#frameTitle').value.trim()||f.title;f.items=$('#elements').value.split('\n').filter(Boolean).map(line=>{let[type,text,target]=line.split('|');return{type:['heading','text','card','button'].includes(type?.trim())?type.trim():'text',text:(text||'Text').trim(),target:target?.trim()||null}});persist();closeDialog();render()}}
function showPreview(id){let f=frames.find(x=>x.id===id)||frames[0];if(!f)return;dialogs.innerHTML='<div class="overlay"><button class="close">×</button><div class="preview-wrap"></div></div>';dialogs.querySelector('.preview-wrap').appendChild(phone(f,true));dialogs.querySelector('.close').onclick=closeDialog;dialogs.querySelector('.overlay').onclick=e=>{if(e.target.classList.contains('overlay'))closeDialog()}}
const schema={type:'object',additionalProperties:false,required:['name','frames'],properties:{name:{type:'string'},frames:{type:'array',minItems:2,maxItems:8,items:{type:'object',additionalProperties:false,required:['id','title','x','y','color','items'],properties:{id:{type:'string'},title:{type:'string'},x:{type:'number'},y:{type:'number'},color:{type:'string'},items:{type:'array',items:{type:'object',additionalProperties:false,required:['type','text','target'],properties:{type:{type:'string',enum:['heading','text','card','button']},text:{type:'string'},target:{type:['string','null']}}}}}}}}};
async function generate(){let text=$('#prompt').value.trim(),key=sessionStorage.pcKey;if(!text)return;if(!key){apiDialog();toast('Lägg in din API-nyckel först',true);return}let btn=$('#create');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';try{let body={model:'gpt-5-mini',input:[{role:'system',content:'Du är en skicklig svensk mobil UX-designer. Skapa 3–6 sammanhängande, realistiska appskärmar. Varje button-target ska vara ett existerande frame-id eller null. Placera skärmarna med cirka 340 mellan x-värden.'},{role:'user',content:text}],text:{format:{type:'json_schema',name:'app_flow',strict:true,schema}}};let res=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await res.json();if(!res.ok)throw Error(data.error?.message||'API-fel '+res.status);let raw=data.output?.flatMap(o=>o.content||[]).find(c=>c.type==='output_text')?.text;if(!raw)throw Error('AI-svaret innehöll inga skärmar');let out=JSON.parse(raw);activeId='p'+Date.now();projects[activeId]={name:out.name,frames:out.frames};frames=out.frames;pan={x:18,y:10};scale=.72;persist();render();toast('Appflödet är skapat och sparat')}catch(e){toast(e.message||'Kunde inte skapa appen',true)}finally{btn.disabled=false;btn.textContent='✦ Skapa'}}
canvas.onpointerdown=e=>{if(e.target!==canvas&&e.target!==wireSvg)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(pointers.size===1)pinch={mode:'pan',x:e.clientX-pan.x,y:e.clientY-pan.y};if(pointers.size===2){let[a,b]=[...pointers.values()];pinch={mode:'zoom',dist:Math.hypot(a.x-b.x,a.y-b.y),scale}}};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&pinch?.mode==='pan'){pan={x:e.clientX-pinch.x,y:e.clientY-pinch.y};render()}else if(pointers.size===2&&pinch?.mode==='zoom'){let[a,b]=[...pointers.values()];scale=Math.max(.38,Math.min(1.35,pinch.scale*Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist));render()}};function up(e){pointers.delete(e.pointerId);pinch=null}canvas.onpointerup=up;canvas.onpointercancel=up;canvas.onwheel=e=>{e.preventDefault();scale=Math.max(.38,Math.min(1.35,scale-e.deltaY*.001));render()};
$('#minus').onclick=()=>{scale=Math.max(.38,scale-.1);render()};$('#plus').onclick=()=>{scale=Math.min(1.35,scale+.1);render()};$('#create').onclick=generate;$('#preview').onclick=()=>showPreview(frames[0]?.id);$('#settings').onclick=apiDialog;$('#projects').onclick=projectsDialog;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();generate()}};persist();render();
</script></body></html>
